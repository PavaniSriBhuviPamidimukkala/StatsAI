services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: skillstat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/skillstat
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
